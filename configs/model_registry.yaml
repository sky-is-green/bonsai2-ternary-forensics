  # Qwen3.5 small series.  These share the 27B target's `qwen3_5` Gated-DeltaNet
  # architecture and are the tractable stand-ins for the architecture port.
  # Every entry below was verified with `inspect_model_targets.py` on the pinned
  # revision: target_count_ok is true and the profile selects only the text
  # decoder (the vision tower and in_proj_a/in_proj_b recurrent controls stay FP).
