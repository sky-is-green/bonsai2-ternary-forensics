schema_version: 1
# Pinned model inventory for architecture-robustness experiments.
# Revisions are immutable Hub commits observed 2026-09-24.  A model being
# listed here does not imply that its weights are cached locally or that a
# full QAT run fits the current two-card node.

hardware:
  node: two AMD Radeon RX 7900 XT (gfx1100)
  usable_vram_bytes_per_card: 21458059264
  usable_vram_gib_per_card: 19.98
  measured_date: 2026-09-24

defaults:
  dtype: bfloat16
  sequence_length: 512
  batch_size: 2
  target_group_size: 128
  teacher: same_architecture_full_precision_self
  metrics: [ppl_ratio, retention, delta_ppl, kl, lm_eval]

