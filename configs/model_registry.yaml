    status: architecture-port
    local_fit: no-full-resident
    notes: >-
      Hybrid Gated-DeltaNet/full-attention multimodal checkpoint.  The language
      tower needs in_proj_qkv/in_proj_z/out_proj plus the usual attention/MLP
      matrices; a 401-tensor, 25.598B-parameter target set is the Prism-aligned
      scope.  Use a text-only extraction or block-wise/sharded runner; two 24GB
      cards cannot hold a normal student+teacher pair.

