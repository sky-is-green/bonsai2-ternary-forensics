    model_type: qwen3_5
    parameters: 853M
    weight_size_bf16: 1.71GB
    target_profile: qwen3_5
    rotation_mode: input
    status: architecture-smoke
    local_fit: yes
    notes: >-
      Fastest qwen3_5 loader/forward smoke.  24 text layers (18 linear-attention
      + 6 full-attention); selects 150/150 linears (0.497B params), lm_head tied
      so it remains FP.  Input rotation widths 1024/2048/3584.

