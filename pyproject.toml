[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-ternary-forensics"
version = "0.1.0"
description = "Independent forensics of Bonsai 2 27B ternary quantization: format recovery, residual localization, and the public-PTQ calibration artifact."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.18",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bonsai_forensics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
